<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>Project image placeholder</title>
  <desc>A placeholder to replace with a project photo, screenshot, or diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152536"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" stroke="#58a6ff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <path fill="url(#background)" d="M0 0h1600v1000H0z"/>
  <path fill="url(#grid)" d="M0 0h1600v1000H0z"/>
  <rect x="64" y="64" width="1472" height="872" rx="22" stroke="#33475b" stroke-dasharray="10 12"/>
  <rect x="710" y="298" width="180" height="144" rx="16" stroke="#7394b6" stroke-width="5"/>
  <circle cx="843" cy="341" r="13" stroke="#7394b6" stroke-width="5"/>
  <path d="m722 424 50-55 37 37 24-24 43 42" stroke="#7394b6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="535" fill="#b8cadc" font-family="Arial, Helvetica, sans-serif" font-size="32" letter-spacing="5" text-anchor="middle">PROJECT IMAGE</text>
  <text x="800" y="595" fill="#8196ac" font-family="Arial, Helvetica, sans-serif" font-size="27" text-anchor="middle">Photo · screenshot · diagram</text>
</svg>
